<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>fx-991EX ClassWiz Replica</title>
<style>
  :root{
    --body: #1c1c1e;
    --body-edge: #f2f2f0;
    --key-dark: #2e2e30;
    --shift-color: #e0a02c;
    --alpha-color: #d1495b;
    --screen: #aebd9d;
    --screen-dark: #93a683;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 30% 10%, #3a3a3e, #0e0e10 75%);
    font-family: Arial, Helvetica, sans-serif;
    padding: 24px;
  }
  .calc{
    width: 500px; max-width: 96vw;
    background: var(--body);
    border-radius: 20px 20px 34px 34px;
    padding: 16px 14px 20px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    border-bottom: 10px solid var(--body-edge);
    position: relative;
  }
  .solar{
    height: 34px;
    margin: 0 26px 10px;
    background: linear-gradient(160deg, #232326, #0a0a0b 60%, #232326);
    border-radius: 2px;
    box-shadow: inset 0 0 0 1px #000;
  }
  .brand-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding: 0 4px 8px;
  }
  .brand{ color:#e9e9e9; font-weight:800; font-size:17px; letter-spacing:1px; font-style:italic; }
  .model-block{ text-align:right; }
  .model{ color:#fff; font-size:13px; font-weight:700; }
  .classwiz{ color:#c23b5a; font-size:9px; font-weight:700; letter-spacing:2px; }

  .screen{
    background: linear-gradient(180deg, var(--screen), var(--screen-dark));
    border-radius: 4px;
    padding: 8px 10px 10px;
    margin-bottom: 12px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.4);
    font-family: 'Courier New', monospace;
  }
  .icon-row{
    display:flex; justify-content:space-between; font-size:9px; color:#3a4632;
    margin-bottom:3px; opacity:0.9; border-bottom: 1px solid rgba(58,70,50,0.25); padding-bottom:2px;
  }
  .icon-row span{ text-align:center; flex:1; }
  .boot-menu{ color:#26301d; font-size:15px; padding: 6px 2px; line-height:1.5; }
  .calc-screen{ display:none; }
  .mode-line{ display:flex; justify-content:space-between; font-size:10px; color:#3a4632; font-weight:700; height:13px; }
  .expr-line{ text-align:right; color:#26301d; font-size:14px; min-height:18px; overflow-x:auto; white-space:nowrap; letter-spacing:0.5px; }
  .result-line{ text-align:right; color:#151d0e; font-size:26px; font-weight:700; min-height:32px; word-break: break-all; }
  .cursor{ display:inline-block; width:2px; background:#26301d; margin-left:1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{opacity:0;} }

  .top-cluster{ display:flex; align-items:center; justify-content:space-between; padding: 4px 6px 10px; }
  .round-btn{
    width:42px; height:42px; border-radius:50%; border:none; cursor:pointer;
    background: radial-gradient(circle at 35% 30%, #4a4a4c, #1d1d1f 75%);
    box-shadow: 0 3px 0 rgba(0,0,0,0.5); color:#fff; font-size:9px; font-weight:700; line-height:1.1;
  }
  .round-btn.shift{ background: radial-gradient(circle at 35% 30%, #f0b850, #b9791a 75%); color:#221400;}
  .round-btn.alpha{ background: radial-gradient(circle at 35% 30%, #e2707f, #a52d3d 75%); color:#220608;}
  .round-btn.active{ box-shadow: 0 0 0 3px rgba(255,255,255,0.5), 0 3px 0 rgba(0,0,0,0.5); }

  .dpad{ position:relative; width:78px; height:78px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #3c3c3e, #101012 80%); box-shadow: 0 3px 0 rgba(0,0,0,0.5); }
  .dpad button{ position:absolute; border:none; background:transparent; color:#9a9a9a; cursor:pointer; font-size:11px; }
  .dpad .up{ top:2px; left:50%; transform:translateX(-50%); }
  .dpad .down{ bottom:2px; left:50%; transform:translateX(-50%); }
  .dpad .left{ left:2px; top:50%; transform:translateY(-50%); }
  .dpad .right{ right:2px; top:50%; transform:translateY(-50%); }
  .dpad .center{ top:50%; left:50%; transform:translate(-50%,-50%); width:26px; height:26px; border-radius:50%; background:#0a0a0b; color:#666; font-size:8px; }
  .menu-on{ display:flex; align-items:center; gap:8px; }
  .menu-on .round-btn{ width:42px; height:42px; }

  .keys{ display:grid; gap: 6px 6px; }
  .function-keys{ grid-template-columns: repeat(6, 1fr); }
  .numeric-keys{ grid-template-columns: repeat(5, 1fr); margin-top: 2px; }
  .key-wrap.spacer{ visibility:hidden; pointer-events:none; }
  .key-wrap{ position:relative; padding-top: 12px; }
  .shift-tag, .alpha-tag{
    position:absolute; top:0; left:0; right:0;
    font-size:7.5px; font-weight:700; line-height:1;
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    padding: 0 1px;
  }
  .shift-tag{ color: var(--shift-color); }
  .alpha-tag{ color: var(--alpha-color); }
  button.key{
    width:100%; border:none; border-radius: 7px; padding: 8px 2px;
    font-size: 11px; font-weight:600; cursor:pointer; color: #e9e7e2;
    background: linear-gradient(180deg, var(--key-dark), #232325);
    box-shadow: 0 3px 0 rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    line-height:1.15; white-space:normal; word-break:keep-all;
    min-height: 40px;
  }
  .dpad button:active{ transform:none; }
  button.key:active{ transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.5); }
  button.key.white{ background: linear-gradient(180deg, #f4f3ee, #d8d6cf); color:#1a1a1a; }
  button.key.blue{ background: linear-gradient(180deg, #3f6bc4, #274a8c); color:#fff; }

  /* Natural fraction button, like the physical key in the reference photo */
  button.key.fraction-key{
    font-family: Arial, Helvetica, sans-serif;
    font-size: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:40px;
  }
  .fraction-icon{
    width:22px;
    height:26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    line-height:1;
    color:currentColor;
  }
  .fraction-icon .box{
    width:10px;
    height:8px;
    border:1.4px solid currentColor;
    border-radius:1px;
    display:block;
  }
  .fraction-icon .bar{
    width:24px;
    height:2px;
    background:currentColor;
    margin:3px 0;
    display:block;
    flex:none;
  }

  .menu-overlay{
    position:absolute; top: 70px; left: 14px; right:14px; background:#eceae4; border-radius:8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 20; max-height: 320px; overflow-y:auto; display:none;
  }
  .menu-overlay.open{ display:block; }
  .menu-overlay .menu-title{ background:#1c1c1e; color:#fff; font-size:12px; font-weight:700; padding:8px 10px; border-radius:8px 8px 0 0; }
  .menu-overlay button{ display:block; width:100%; text-align:left; padding:9px 12px; border:none; background:none; font-size:13px; color:#222; cursor:pointer; border-bottom: 1px solid #d6d3cb; }
  .menu-overlay button:hover{ background:#dcd9d0; }
  .menu-overlay .close-row{ text-align:center; padding:8px; font-size:12px; font-weight:700; color:#a52d3d; cursor:pointer; }

  /* QR popup - used by SHIFT + OPTN (yellow QR label) */
  .qr-overlay{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.72); z-index:100;
    padding:20px;
  }
  .qr-overlay.open{ display:flex; }
  .qr-card{
    width:min(340px,92vw); background:#eceae4; color:#222; border-radius:12px;
    padding:16px; box-shadow:0 18px 50px rgba(0,0,0,.65); text-align:center;
  }
  .qr-title{font-weight:800; font-size:16px; margin-bottom:5px;}
  .qr-sub{font-size:11px; color:#555; margin-bottom:12px;}
  #qrCode{
    width:220px; min-height:220px; margin:0 auto 12px; padding:10px;
    background:#fff; border-radius:6px; display:flex; align-items:center; justify-content:center;
  }
  #qrCode img, #qrCode canvas{display:block; margin:auto; max-width:200px; max-height:200px;}
  .qr-value{
    font-family:'Courier New',monospace; font-size:12px; word-break:break-all;
    background:#fff; border:1px solid #ccc; border-radius:6px; padding:7px; margin-bottom:10px;
  }
  .qr-close{
    border:none; border-radius:7px; padding:9px 18px; cursor:pointer;
    background:#2e2e30; color:#fff; font-weight:700;
  }
</style>
</head>
<body>

<div class="calc" id="calcBody">
  <div class="solar"></div>

  <div class="brand-row">
    <div class="brand">CASIO</div>
    <div class="model-block">
      <div class="model">fx-991EX</div>
      <div class="classwiz">C L A S S W I Z</div>
    </div>
  </div>

  <div class="screen">
    <div class="icon-row">
      <span>×÷<br>+−</span><span>✎</span><span>2 8<br>10 16</span><span>⊞</span>
      <span>⇕</span><span>▤</span><span>📐</span><span>⊟</span>
    </div>
    <div class="boot-menu" id="bootMenu">1:Calculate</div>
    <div class="calc-screen" id="calcScreen">
      <div class="mode-line"><span id="modeIndicator">Deg</span><span id="shiftAlphaIndicator"></span></div>
      <div class="expr-line" id="exprLine">&nbsp;</div>
      <div class="result-line" id="resultLine">0</div>
    </div>
  </div>

  <div class="top-cluster">
    <button class="round-btn shift" id="shiftBtn" onclick="toggleMode('shift')">SHIFT</button>
    <button class="round-btn alpha" id="alphaBtn" onclick="toggleMode('alpha')">ALPHA</button>
    <div class="dpad">
      <button class="up" onclick="navigate('up')">▲</button>
      <button class="down" onclick="navigate('down')">▼</button>
      <button class="left" onclick="navigate('left')">◀</button>
      <button class="right" onclick="navigate('right')">▶</button>
      <button class="center" onclick="navigate('ok')">OK</button>
    </div>
    <div class="menu-on">
      <button class="round-btn" onclick="openMenu('settings')">MENU<br>SETUP</button>
      <button class="round-btn" onclick="powerOn()">ON</button>
    </div>
  </div>

  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-title" id="menuTitle">Menu</div>
    <div id="menuItems"></div>
    <div class="close-row" onclick="closeMenu()">CLOSE</div>
  </div>

  <div class="qr-overlay" id="qrOverlay" onclick="closeQR(event)">
    <div class="qr-card" onclick="event.stopPropagation()">
      <div class="qr-title">QR</div>
      <div class="qr-sub">SHIFT + OPTN — scan the displayed calculator value</div>
      <div id="qrCode"></div>
      <div class="qr-value" id="qrValue">0</div>
      <button class="qr-close" onclick="closeQR()">CLOSE</button>
    </div>
  </div>

  <div class="keys function-keys" id="functionKeyGrid"></div>
  <div class="keys numeric-keys" id="numericKeyGrid"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ---------------- STATE ---------------- */
let expr = "";
let cursorPos = 0;
let mode = "";
let angleMode = "Deg";
let memory = 0;
let varX = 0;
let lastAns = 0;
let history = [];
let historyIdx = -1;
let poweredOn = false;
let fractionView = false;
let engMode = false;

const bootMenu = document.getElementById('bootMenu');
const calcScreen = document.getElementById('calcScreen');
const exprLine = document.getElementById('exprLine');
const resultLine = document.getElementById('resultLine');
const modeIndicator = document.getElementById('modeIndicator');
const shiftAlphaIndicator = document.getElementById('shiftAlphaIndicator');

/* ---------------- KEY LAYOUT (mirrors fx-991EX columns) ---------------- */
const FUNCTION_KEYS = [
  [
    {m:"OPTN", act:()=>openMenu('optn'), s:"QR", sAct:()=>showQR()},
    {m:"CALC", act:()=>doCalc(), s:"SOLVE", sAct:()=>doCalc()},
    {m:"□/□", cls:"fraction-key", act:()=>insertFraction(), s:"□/□", sAct:()=>insertFraction()},
    {m:"S⇔D", act:()=>toggleFraction(), s:"↔"},
    {m:"x", act:()=>insert("X"), a:"X"}
  ],
  [
    {m:"√", act:()=>insertFn("sqrt("), s:"x³", sAct:()=>insert("^3")},
    {m:"x²", act:()=>insert("^2"), s:"√", sAct:()=>insertFn("sqrt(")},
    {m:"xⁿ", act:()=>insert("^"), s:"x⁻¹", sAct:()=>insert("^(-1)")},
    {m:"logₐ", act:()=>insertFn("logY("), s:"10ˣ", sAct:()=>insert("10^")},
    {m:"ln", act:()=>insertFn("ln("), s:"eˣ", sAct:()=>insert("e^")}
  ],
  [
    {m:"log", act:()=>insertFn("log10("), s:"e", sAct:()=>insert("e")},
    {m:"x!", act:()=>insert("!"), s:"nPr", sAct:()=>insert("nPr(")},
    {m:"x⁻¹", act:()=>insert("^(-1)"), s:"nCr", sAct:()=>insert("nCr(")},
    {m:"sin", act:()=>insertFn("sin("), s:"sin⁻¹", sAct:()=>insertFn("asin(")},
    {m:"cos", act:()=>insertFn("cos("), s:"cos⁻¹", sAct:()=>insertFn("acos(")}
  ],
  [
    {m:"tan", act:()=>insertFn("tan("), s:"tan⁻¹", sAct:()=>insertFn("atan(")},
    {m:"(-)", act:()=>negate()},
    {m:"° ′ ″", act:()=>insertFn("dms(")},
    {m:"STO", act:()=>storeVar(), s:"RECALL", sAct:()=>insert("X")},
    {m:"ENG", act:()=>toggleEng()}
  ],
  [
    {m:"(", act:()=>insert("("), s:"Abs", sAct:()=>insertFn("abs(")},
    {m:")", act:()=>insert(")")},
    {m:"Abs", act:()=>insertFn("abs(")},
    {m:"M+", act:()=>memoryAdd(1), s:"M-", sAct:()=>memoryAdd(-1)},
    {m:"RCL", act:()=>insert("X")}
  ]
];

const NUMERIC_KEYS = [
  [
    {m:"7", cls:"white", act:()=>insert("7"), s:"CONST", sAct:()=>openMenu('const')},
    {m:"8", cls:"white", act:()=>insert("8"), s:"CONV", sAct:()=>openMenu('conv')},
    {m:"9", cls:"white", act:()=>insert("9"), s:"RESET", sAct:()=>resetCalc()},
    {m:"DEL", cls:"blue", act:()=>backspace(), s:"INS", sAct:()=>insert(" ")},
    {m:"AC", cls:"blue", act:()=>clearAll(), s:"OFF", sAct:()=>powerOff()}
  ],
  [
    {m:"4", cls:"white", act:()=>insert("4")},
    {m:"5", cls:"white", act:()=>insert("5")},
    {m:"6", cls:"white", act:()=>insert("6"), s:"Pol", sAct:()=>insertFn("pol(")},
    {m:"×", cls:"white", act:()=>insert("*"), s:"Rec", sAct:()=>insertFn("rec(")},
    {m:"÷", cls:"white", act:()=>insert("/")}
  ],
  [
    {m:"1", cls:"white", act:()=>insert("1")},
    {m:"2", cls:"white", act:()=>insert("2")},
    {m:"3", cls:"white", act:()=>insert("3")},
    {m:"+", cls:"white", act:()=>insert("+"), s:"Ran#", sAct:()=>insert(Math.random().toFixed(6))},
    {m:"−", cls:"white", act:()=>insert("-"), s:"%", sAct:()=>insert("/100")}
  ],
  [
    {m:"0", cls:"white", act:()=>insert("0"), s:"Rnd", sAct:()=>roundAns()},
    {m:".", cls:"white", act:()=>insert(".")},
    {m:"×10ˣ", cls:"white", act:()=>insert("E")},
    {m:"Ans", cls:"white", act:()=>insert("Ans")},
    {m:"=", cls:"white", act:()=>calculate(), s:"≈", sAct:()=>calculate()}
  ]
];

/* ---------------- MENUS ---------------- */
const MENUS = {
  calculus: { title: "CALCULUS", items: [
    ["Derivative: use d/dx (not implemented)", ()=>flash("d/dx")],
    ["Integral: numerical integration not implemented", ()=>flash("Integral")]
  ]},
  optn: { title: "OPTN", items: [
    ["nPr(", ()=>insert("nPr(")],
    ["nCr(", ()=>insert("nCr(")],
    ["Pol(x,y)", ()=>insertFn("pol(")],
    ["Rec(r,θ)", ()=>insertFn("rec(")],
    ["Abs(", ()=>insertFn("abs(")],
    ["Rnd (round Ans)", ()=>roundAns()],
  ]},
  settings: { title: "MENU / SETUP", items: [
    ["Angle: Deg", ()=>setAngle('Deg')],
    ["Angle: Rad", ()=>setAngle('Rad')],
    ["Angle: Gra", ()=>setAngle('Gra')],
    ["RESET calculator", ()=>resetCalc()],
  ]},
  const: { title: "CONSTANTS", items: [
    ["π = 3.14159...", ()=>insert("pi")],
    ["e = 2.71828...", ()=>insert("e")],
    ["c (light speed) = 299792458", ()=>insert("299792458")],
    ["g (gravity) = 9.80665", ()=>insert("9.80665")],
    ["Na (Avogadro) = 6.02214×10²³", ()=>insert("6.02214*10^23")],
  ]},
  conv: { title: "UNIT CONVERSION", items: [
    ["1 in = 2.54 cm", ()=>insert("2.54")],
    ["1 lb = 0.453592 kg", ()=>insert("0.453592")],
    ["1 mile = 1.60934 km", ()=>insert("1.60934")],
    ["1 gal = 3.78541 L", ()=>insert("3.78541")],
  ]}
};

/* ---------------- BUILD GRID ---------------- */
function buildKeys(grid, containerId){
  const container = document.getElementById(containerId);
  grid.forEach(row=>{
    row.forEach(k=>{
      const wrap = document.createElement('div');
      wrap.className = 'key-wrap' + (k.spacer ? ' spacer' : '');
      if(k.spacer){
        container.appendChild(wrap);
        return;
      }
      if(k.s){
        const st = document.createElement('div');
        st.className = 'shift-tag';
        st.textContent = k.s;
        wrap.appendChild(st);
      }
      if(k.a){
        const at = document.createElement('div');
        at.className = 'alpha-tag';
        at.textContent = k.a;
        wrap.appendChild(at);
      }
      const btn = document.createElement('button');
      btn.className = 'key' + (k.cls ? ' ' + k.cls : '');

      if(k.cls && k.cls.split(/\\s+/).includes('fraction-key')){
        const icon = document.createElement('span');
        icon.className = 'fraction-icon';
        icon.innerHTML = '<span class="box"></span><span class="bar"></span><span class="box"></span>';
        btn.appendChild(icon);
      }else{
        btn.textContent = k.m;
      }

      btn.onclick = ()=>handleKey(k);
      wrap.appendChild(btn);
      container.appendChild(wrap);
    });
  });
}

function handleKey(k){
  ensureOn();
  if(mode === 'shift' && typeof k.sAct === 'function'){
    k.sAct();
    resetMode();
    return;
  }
  if(mode === 'alpha' && typeof k.aAct === 'function'){
    k.aAct();
    resetMode();
    return;
  }
  if(typeof k.act === 'function'){
    k.act();
  }
  resetMode();
}

buildKeys(FUNCTION_KEYS, 'functionKeyGrid');
buildKeys(NUMERIC_KEYS, 'numericKeyGrid');

/* ---------------- MODE (SHIFT/ALPHA) ---------------- */
function toggleMode(which){
  ensureOn();
  mode = (mode === which) ? "" : which;
  document.getElementById('shiftBtn').classList.toggle('active', mode==='shift');
  document.getElementById('alphaBtn').classList.toggle('active', mode==='alpha');
  shiftAlphaIndicator.textContent = mode ? mode.toUpperCase() : "";
}
function resetMode(){
  mode = "";
  document.getElementById('shiftBtn').classList.remove('active');
  document.getElementById('alphaBtn').classList.remove('active');
  shiftAlphaIndicator.textContent = "";
}

/* ---------------- POWER ---------------- */
function ensureOn(){ if(!poweredOn) powerOn(); }
function powerOn(){
  poweredOn = true;
  bootMenu.style.display = 'none';
  calcScreen.style.display = 'block';
  updateScreen();
}
function powerOff(){
  poweredOn = false;
  bootMenu.style.display = 'block';
  bootMenu.textContent = '1:Calculate';
  calcScreen.style.display = 'none';
}

/* ---------------- MENU OVERLAY ---------------- */
const menuOverlay = document.getElementById('menuOverlay');
const menuTitle = document.getElementById('menuTitle');
const menuItems = document.getElementById('menuItems');
function openMenu(key){
  const def = MENUS[key];
  if(!def) return;
  menuTitle.textContent = def.title;
  menuItems.innerHTML = "";
  def.items.forEach(([label, fn])=>{
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = ()=>{ fn(); closeMenu(); };
    menuItems.appendChild(b);
  });
  menuOverlay.classList.add('open');
}
function closeMenu(){ menuOverlay.classList.remove('open'); }

/* ---------------- SCREEN / EXPRESSION ---------------- */
function updateScreen(){
  modeIndicator.textContent = angleMode;
  const before = expr.slice(0, cursorPos);
  const after = expr.slice(cursorPos);
  exprLine.innerHTML = (before || after) ? escapeHtml(before) + '<span class="cursor">&nbsp;</span>' + escapeHtml(after) : '&nbsp;';
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function insert(text){
  ensureOn();
  expr = expr.slice(0, cursorPos) + text + expr.slice(cursorPos);
  cursorPos += text.length;
  updateScreen();
}
function insertFraction(){
  ensureOn();

  // Insert a real editable fraction template.
  // The cursor is placed inside the numerator so the user can type naturally.
  const template = "( )/( )";
  expr = expr.slice(0, cursorPos) + template + expr.slice(cursorPos);

  // Position cursor between the numerator parentheses.
  cursorPos += 2;
  updateScreen();
}
function insertFn(text){ insert(text); }
function backspace(){
  if(cursorPos > 0){
    expr = expr.slice(0, cursorPos-1) + expr.slice(cursorPos);
    cursorPos -= 1;
  }
  updateScreen();
}
function negate(){ insert("-"); }
function clearAll(){
  expr = ""; cursorPos = 0;
  resultLine.textContent = "0";
  updateScreen();
}
function navigate(dir){
  ensureOn();
  if(dir === 'left'){ cursorPos = Math.max(0, cursorPos-1); }
  else if(dir === 'right'){ cursorPos = Math.min(expr.length, cursorPos+1); }
  else if(dir === 'up'){ historyNav(-1); }
  else if(dir === 'down'){ historyNav(1); }
  else if(dir === 'ok'){ calculate(); }
  updateScreen();
}
function historyNav(delta){
  if(history.length === 0) return;
  historyIdx = Math.min(history.length-1, Math.max(0, historyIdx + delta));
  expr = history[historyIdx];
  cursorPos = expr.length;
}

/* ---------------- MEMORY / VARIABLES ---------------- */
function storeVar(){
  const val = evaluateExpr(expr || resultLine.textContent);
  if(val !== null){ varX = val; flash("STO X = " + trimNum(val)); }
}
function memoryAdd(sign){
  const val = evaluateExpr(expr || resultLine.textContent);
  if(val !== null){ memory += sign * val; flash("M = " + trimNum(memory)); }
}
function flash(msg){
  const old = resultLine.textContent;
  resultLine.textContent = msg;
  setTimeout(()=>{ resultLine.textContent = old; }, 800);
}
function trimNum(n){ return Number(n.toPrecision(10)).toString(); }

/* ---------------- SETTINGS ---------------- */
function setAngle(a){ angleMode = a; updateScreen(); }
function resetCalc(){
  expr=""; cursorPos=0; memory=0; varX=0; lastAns=0; history=[]; historyIdx=-1; angleMode='Deg';
  resultLine.textContent = "0";
  updateScreen();
  flash("Reset done");
}
function toggleEng(){ engMode = !engMode; flash(engMode ? "ENG on" : "ENG off"); }
function roundAns(){
  const val = evaluateExpr(resultLine.textContent);
  if(val !== null){
    const r = Math.round(val*1e10)/1e10;
    resultLine.textContent = trimNum(r);
    expr = trimNum(r); cursorPos = expr.length;
    updateScreen();
  }
}
function toggleFraction(){
  fractionView = !fractionView;
  const val = evaluateExpr(resultLine.textContent);
  if(val === null) return;
  resultLine.textContent = fractionView ? toFraction(val) : trimNum(val);
}
function toFraction(x){
  if(Math.abs(x - Math.round(x)) < 1e-9) return Math.round(x).toString();
  const tolerance = 1.0E-6;
  let h1=1,h2=0,k1=0,k2=1,b=x;
  do{
    const a = Math.floor(b);
    let aux=h1; h1=a*h1+h2; h2=aux;
    aux=k1; k1=a*k1+k2; k2=aux;
    b=1/(b-a);
  } while(Math.abs(x-h1/k1) > x*tolerance && k1 < 100000);
  return h1 + "/" + k1;
}

/* ---------------- MATH EVAL ---------------- */
function factorial(n){
  if(n < 0 || Math.floor(n) !== n) return NaN;
  let r = 1;
  for(let i=2;i<=n;i++) r *= i;
  return r;
}
function nPr(n, r){ return factorial(n) / factorial(n-r); }
function nCr(n, r){ return factorial(n) / (factorial(r) * factorial(n-r)); }
function logY(base, x){ return Math.log(x) / Math.log(base); }
function dms(x){
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const d = Math.floor(x);
  const mFull = (x - d) * 60;
  const m = Math.floor(mFull);
  const s = (mFull - m) * 60;
  return sign * (d + m/100 + s/10000);
}
function pol(x, y){ return Math.sqrt(x*x+y*y); }
function rec(r, theta){ return r*Math.cos(theta*Math.PI/180); }

function evaluateExpr(str){
  if(!str) return null;
  try{
    let toRad = v => angleMode === 'Deg' ? v*Math.PI/180 : angleMode === 'Gra' ? v*Math.PI/200 : v;
    let toOut = v => angleMode === 'Deg' ? v*180/Math.PI : angleMode === 'Gra' ? v*200/Math.PI : v;

    let s = str;
    s = s.replace(/(\d+(\.\d+)?)!/g, (m, num) => `fact(${num})`);
    s = s.replace(/\^/g, '**');
    s = s.replace(/(?<![a-zA-Z_])pi(?![a-zA-Z_])/g, 'PI_C');
    s = s.replace(/(?<![a-zA-Z_])e(?![a-zA-Z_(])/g, 'E_C');
    s = s.replace(/(?<![a-zA-Z_])Ans(?![a-zA-Z_])/g, 'ANS_C');
    s = s.replace(/(?<![a-zA-Z_])X(?![a-zA-Z_])/g, 'X_C');
    s = s.replace(/(\d+(\.\d+)?)E(-?\d+)?/g, (m, base, _, ex) => `(${base}*10**(${ex||0}))`);

    const scope = {
      PI_C: Math.PI, E_C: Math.E, ANS_C: lastAns, X_C: varX,
      sqrt: Math.sqrt, cbrt: Math.cbrt,
      log10: Math.log10, ln: Math.log, logY,
      fact: factorial, nPr, nCr, abs: Math.abs, dms, pol, rec,
      sin: x=>Math.sin(toRad(x)), cos: x=>Math.cos(toRad(x)), tan: x=>Math.tan(toRad(x)),
      asin: x=>toOut(Math.asin(x)), acos: x=>toOut(Math.acos(x)), atan: x=>toOut(Math.atan(x)),
    };
    const names = Object.keys(scope);
    const vals = names.map(k=>scope[k]);
    const fn = new Function(...names, `return (${s});`);
    const val = fn(...vals);
    if(typeof val !== 'number' || isNaN(val) || !isFinite(val)) return null;
    return val;
  }catch(e){ return null; }
}

function calculate(){
  ensureOn();
  const val = evaluateExpr(expr);
  if(val === null){ resultLine.textContent = "Math ERROR"; return; }
  lastAns = val;
  history.push(expr); historyIdx = history.length;
  let disp = trimNum(val);
  resultLine.textContent = disp;
  expr = disp; cursorPos = expr.length;
  updateScreen();
}
function doCalc(){ calculate(); }

/* ---------------- KEYBOARD SUPPORT ---------------- */
document.addEventListener('keydown', (e)=>{
  const key = e.key;
  if(/[0-9.+\-*/()!]/.test(key)){ insert(key); }
  else if(key === 'Enter'){ calculate(); }
  else if(key === 'Backspace'){ backspace(); }
  else if(key === 'Escape'){
    if(qrOverlay.classList.contains('open')) closeQR();
    else clearAll();
  }
  else if(key === 'ArrowLeft'){ navigate('left'); }
  else if(key === 'ArrowRight'){ navigate('right'); }
  else if(key === 'ArrowUp'){ navigate('up'); }
  else if(key === 'ArrowDown'){ navigate('down'); }
});

powerOn();
updateScreen();
</script>
