<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word to PDF Converter</title>

<!-- Mammoth: DOCX -> HTML -->
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>

<!-- html2pdf: HTML -> PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #222;
}

/* =========================
   HEADER
========================= */

.header {
    height: 64px;
    background: white;
    border-bottom: 1px solid #e4e7ec;
    display: flex;
    align-items: center;
    padding: 0 35px;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
}

.logoIcon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: #e53935;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.headerText {
    color: #666;
    font-size: 14px;
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1150px;
    margin: 35px auto;
    padding: 0 20px;
}

.title {
    text-align: center;
    font-size: 34px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 30px;
}

/* =========================
   UPLOAD BOX
========================= */

.uploadBox {
    background: white;
    border: 2px dashed #cfd5df;
    border-radius: 16px;
    min-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    padding: 30px;
}

.uploadBox:hover,
.uploadBox.dragover {
    border-color: #2563eb;
    background: #f8fbff;
}

.uploadIcon {
    font-size: 55px;
    margin-bottom: 15px;
}

.uploadTitle {
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 8px;
}

.uploadDescription {
    color: #777;
    margin-bottom: 20px;
}

.chooseBtn {
    display: inline-block;
    background: #2563eb;
    color: white;
    padding: 12px 25px;
    border-radius: 8px;
    font-weight: 600;
}

#fileInput {
    display: none;
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: none;
    background: white;
    margin-top: 20px;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid #e4e7ec;
}

.controlRow {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    align-items: center;
}

.controlGroup {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.controlGroup label {
    font-size: 12px;
    color: #666;
    font-weight: 600;
}

select,
input[type="text"] {
    padding: 9px 12px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    background: white;
}

/* =========================
   ACTION BUTTONS
========================= */

.actions {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 11px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
}

.convertBtn {
    background: #16a34a;
    color: white;
}

.convertBtn:hover {
    background: #15803d;
}

.clearBtn {
    background: #f1f5f9;
    color: #333;
}

.downloadBtn {
    background: #2563eb;
    color: white;
    display: none;
}

/* =========================
   PROGRESS
========================= */

.progressArea {
    display: none;
    margin-top: 20px;
}

.progressText {
    font-size: 14px;
    margin-bottom: 7px;
}

.progressBar {
    height: 9px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.progressFill {
    height: 100%;
    width: 0%;
    background: #2563eb;
    transition: width 0.3s;
}

/* =========================
   PREVIEW
========================= */

.previewArea {
    display: none;
    margin-top: 25px;
}

.previewHeader {
    background: white;
    border: 1px solid #e4e7ec;
    border-bottom: none;
    border-radius: 10px 10px 0 0;
    padding: 15px 20px;
    font-weight: 600;
}

.previewContainer {
    background: #dfe3e8;
    padding: 30px;
    overflow: auto;
    min-height: 500px;
}

#preview {
    margin: auto;
    background: white;
    width: 794px;
    min-height: 1123px;
    padding: 75px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    color: #111;
}

/* =========================
   WORD CONTENT
========================= */

#preview h1 {
    font-size: 28px;
    margin-top: 0;
}

#preview h2 {
    font-size: 23px;
}

#preview h3 {
    font-size: 19px;
}

#preview p {
    line-height: 1.5;
    margin: 0 0 12px;
}

#preview img {
    max-width: 100%;
    height: auto;
}

#preview table {
    width: 100%;
    border-collapse: collapse;
    margin: 15px 0;
}

#preview td,
#preview th {
    border: 1px solid #444;
    padding: 7px;
    vertical-align: top;
}

#preview ul,
#preview ol {
    margin-top: 5px;
    margin-bottom: 12px;
}

#preview blockquote {
    margin-left: 20px;
    padding-left: 15px;
    border-left: 4px solid #ccc;
}

/* =========================
   STATUS
========================= */

.status {
    display: none;
    margin-top: 15px;
    padding: 12px 15px;
    border-radius: 8px;
    background: #eff6ff;
    color: #1d4ed8;
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    padding: 30px;
    color: #777;
    font-size: 13px;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 850px) {

    .header {
        padding: 0 15px;
    }

    .headerText {
        display: none;
    }

    .title {
        font-size: 27px;
    }

    #preview {
        width: 100%;
        min-height: auto;
        padding: 40px;
    }

    .previewContainer {
        padding: 10px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        <div class="logoIcon">PDF</div>
        <span>Word to PDF</span>
    </div>

    <div class="headerText">
        Free DOCX to PDF Converter
    </div>

</header>


<main class="container">

    <h1 class="title">
        Convert Word to PDF
    </h1>

    <p class="subtitle">
        Convert DOCX files to PDF while preserving text, images and tables.
    </p>


    <!-- =========================
         UPLOAD
    ========================== -->

    <div class="uploadBox" id="uploadBox">

        <div>

            <div class="uploadIcon">📄</div>

            <div class="uploadTitle">
                Drag & Drop your Word file here
            </div>

            <div class="uploadDescription">
                or select a DOCX file from your computer
            </div>

            <label class="chooseBtn" for="fileInput">
                Choose Word File
            </label>

            <input
                type="file"
                id="fileInput"
                accept=".docx"
            >

        </div>

    </div>


    <!-- =========================
         CONTROLS
    ========================== -->

    <div class="controls" id="controls">

        <div class="controlRow">

            <div class="controlGroup">

                <label>Page Size</label>

                <select id="pageSize">

                    <option value="a4">
                        A4
                    </option>

                    <option value="letter">
                        Letter
                    </option>

                    <option value="legal">
                        Legal
                    </option>

                </select>

            </div>


            <div class="controlGroup">

                <label>Orientation</label>

                <select id="orientation">

                    <option value="portrait">
                        Portrait
                    </option>

                    <option value="landscape">
                        Landscape
                    </option>

                </select>

            </div>


            <div class="controlGroup">

                <label>Margin</label>

                <select id="margin">

                    <option value="10">
                        Small
                    </option>

                    <option value="15" selected>
                        Normal
                    </option>

                    <option value="25">
                        Large
                    </option>

                </select>

            </div>


            <div class="controlGroup">

                <label>PDF File Name</label>

                <input
                    type="text"
                    id="fileName"
                    value="converted-document"
                >

            </div>

        </div>


        <div class="actions">

            <button
                class="convertBtn"
                id="convertBtn"
            >
                Convert to PDF
            </button>

            <button
                class="downloadBtn"
                id="downloadBtn"
            >
                Download PDF
            </button>

            <button
                class="clearBtn"
                id="clearBtn"
            >
                Clear
            </button>

        </div>

    </div>


    <!-- =========================
         PROGRESS
    ========================== -->

    <div class="progressArea" id="progressArea">

        <div
            class="progressText"
            id="progressText"
        >
            Preparing document...
        </div>

        <div class="progressBar">

            <div
                class="progressFill"
                id="progressFill"
            ></div>

        </div>

    </div>


    <!-- =========================
         STATUS
    ========================== -->

    <div
        class="status"
        id="status"
    ></div>


    <!-- =========================
         PREVIEW
    ========================== -->

    <div
        class="previewArea"
        id="previewArea"
    >

        <div class="previewHeader">
            Document Preview
        </div>

        <div class="previewContainer">

            <div id="preview"></div>

        </div>

    </div>

</main>


<footer class="footer">

    Word to PDF Converter • Runs in your browser

</footer>


<script>

let currentFile = null;
let generatedPDF = null;


/* =========================
   ELEMENTS
========================= */

const uploadBox =
    document.getElementById("uploadBox");

const fileInput =
    document.getElementById("fileInput");

const controls =
    document.getElementById("controls");

const previewArea =
    document.getElementById("previewArea");

const preview =
    document.getElementById("preview");

const convertBtn =
    document.getElementById("convertBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const clearBtn =
    document.getElementById("clearBtn");

const progressArea =
    document.getElementById("progressArea");

const progressFill =
    document.getElementById("progressFill");

const progressText =
    document.getElementById("progressText");

const statusBox =
    document.getElementById("status");


/* =========================
   FILE SELECTION
========================= */

fileInput.addEventListener(
    "change",
    function () {

        if (this.files.length > 0) {

            handleFile(this.files[0]);

        }

    }
);


/* =========================
   CLICK UPLOAD
========================= */

uploadBox.addEventListener(
    "click",
    function(e) {

        if (
            e.target.tagName !== "LABEL" &&
            e.target.tagName !== "INPUT"
        ) {

            fileInput.click();

        }

    }
);


/* =========================
   DRAG & DROP
========================= */

uploadBox.addEventListener(
    "dragover",
    function(e) {

        e.preventDefault();

        uploadBox.classList.add("dragover");

    }
);


uploadBox.addEventListener(
    "dragleave",
    function() {

        uploadBox.classList.remove("dragover");

    }
);


uploadBox.addEventListener(
    "drop",
    function(e) {

        e.preventDefault();

        uploadBox.classList.remove("dragover");

        const files = e.dataTransfer.files;

        if (files.length > 0) {

            handleFile(files[0]);

        }

    }
);


/* =========================
   HANDLE FILE
========================= */

async function handleFile(file) {

    const extension =
        file.name.split(".").pop().toLowerCase();


    if (extension !== "docx") {

        showStatus(
            "Please select a .DOCX Word file.",
            true
        );

        return;

    }


    currentFile = file;


    let filename =
        file.name.replace(/\.[^/.]+$/, "");


    document.getElementById("fileName").value =
        filename;


    showStatus(
        "Reading Word document..."
    );


    progressArea.style.display = "block";

    progressText.textContent =
        "Loading Word document...";

    progressFill.style.width = "20%";


    try {

        const arrayBuffer =
            await file.arrayBuffer();


        progressFill.style.width = "40%";


        /*
         * Convert DOCX to HTML
         *
         * Mammoth extracts:
         * - Text
         * - Headings
         * - Lists
         * - Tables
         * - Images
         */

        const result =
            await mammoth.convertToHtml(
                {
                    arrayBuffer: arrayBuffer
                },
                {
                    convertImage:
                    mammoth.images.imgElement(
                        function(image) {

                            return image
                                .read("base64")
                                .then(function(imageBuffer) {

                                    return {

                                        src:
                                            "data:" +
                                            image.contentType +
                                            ";base64," +
                                            imageBuffer

                                    };

                                });

                        }
                    )
                }
            );


        progressFill.style.width = "70%";


        preview.innerHTML =
            result.value;


        /*
         * Make sure images don't overflow
         */

        const images =
            preview.querySelectorAll("img");


        images.forEach(
            function(img) {

                img.style.maxWidth = "100%";
                img.style.height = "auto";

            }
        );


        progressFill.style.width = "100%";


        previewArea.style.display = "block";

        controls.style.display = "block";

        progressArea.style.display = "none";


        showStatus(
            "Document loaded successfully. Review the preview and click Convert to PDF."
        );


        if (result.messages.length > 0) {

            console.log(
                "Mammoth messages:",
                result.messages
            );

        }

    }

    catch(error) {

        console.error(error);

        progressArea.style.display = "none";

        showStatus(
            "Could not read this Word document.",
            true
        );

    }

}


/* =========================
   CONVERT TO PDF
========================= */

convertBtn.addEventListener(
    "click",
    async function() {

        if (!currentFile) {

            showStatus(
                "Please select a Word document first.",
                true
            );

            return;

        }


        convertBtn.disabled = true;

        downloadBtn.style.display = "none";


        progressArea.style.display = "block";

        progressText.textContent =
            "Preparing PDF...";

        progressFill.style.width =
            "10%";


        try {

            /*
             * Clone preview so that we can
             * safely modify the PDF version.
             */

            const pdfElement =
                preview.cloneNode(true);


            pdfElement.style.background =
                "white";


            pdfElement.style.width =
                "100%";


            pdfElement.style.minHeight =
                "auto";


            pdfElement.style.padding =
                document.getElementById("margin").value +
                "mm";


            pdfElement.style.boxShadow =
                "none";


            /*
             * PDF settings
             */

            const pageSize =
                document.getElementById(
                    "pageSize"
                ).value;


            const orientation =
                document.getElementById(
                    "orientation"
                ).value;


            let filename =
                document.getElementById(
                    "fileName"
                ).value.trim();


            if (!filename) {

                filename =
                    "converted-document";

            }


            if (!filename.toLowerCase().endsWith(".pdf")) {

                filename += ".pdf";

            }


            progressText.textContent =
                "Creating PDF...";

            progressFill.style.width =
                "30%";


            /*
             * html2pdf options
             */

            const options = {

                margin:
                    Number(
                        document.getElementById(
                            "margin"
                        ).value
                    ),

                filename:
                    filename,

                image: {

                    type: "jpeg",

                    quality: 0.98

                },

                html2canvas: {

                    scale: 2,

                    useCORS: true,

                    allowTaint: false,

                    logging: false

                },

                jsPDF: {

                    unit: "mm",

                    format: pageSize,

                    orientation:
                        orientation

                },

                pagebreak: {

                    mode: [
                        "css",
                        "legacy"
                    ],

                    avoid: [
                        "img",
                        "table",
                        "tr"
                    ]

                }

            };


            progressFill.style.width =
                "50%";


            /*
             * Generate PDF Blob
             */

            generatedPDF =
                await html2pdf()
                    .set(options)
                    .from(pdfElement)
                    .outputPdf("blob");


            progressFill.style.width =
                "100%";


            progressText.textContent =
                "PDF created successfully.";


            downloadBtn.style.display =
                "inline-block";


            showStatus(
                "PDF is ready. Click Download PDF to save it."
            );


        }

        catch(error) {

            console.error(error);

            showStatus(
                "PDF conversion failed: " +
                error.message,
                true
            );

        }


        convertBtn.disabled = false;

    }
);


/* =========================
   DOWNLOAD
========================= */

downloadBtn.addEventListener(
    "click",
    function() {

        if (!generatedPDF) {

            showStatus(
                "Please convert the document first.",
                true
            );

            return;

        }


        let filename =
            document.getElementById(
                "fileName"
            ).value.trim();


        if (!filename) {

            filename =
                "converted-document";

        }


        if (!filename.toLowerCase().endsWith(".pdf")) {

            filename += ".pdf";

        }


        const url =
            URL.createObjectURL(
                generatedPDF
            );


        const link =
            document.createElement("a");


        link.href = url;

        link.download = filename;

        document.body.appendChild(link);

        link.click();

        link.remove();


        setTimeout(
            function() {

                URL.revokeObjectURL(url);

            },
            1000
        );

    }
);


/* =========================
   CLEAR
========================= */

clearBtn.addEventListener(
    "click",
    function() {

        currentFile = null;

        generatedPDF = null;

        fileInput.value = "";

        preview.innerHTML = "";

        controls.style.display =
            "none";

        previewArea.style.display =
            "none";

        progressArea.style.display =
            "none";

        downloadBtn.style.display =
            "none";

        progressFill.style.width =
            "0%";

        statusBox.style.display =
            "none";

        document.getElementById(
            "fileName"
        ).value =
            "converted-document";

    }
);


/* =========================
   STATUS MESSAGE
========================= */

function showStatus(message, error = false) {

    statusBox.style.display =
        "block";

    statusBox.textContent =
        message;


    if (error) {

        statusBox.style.background =
            "#fef2f2";

        statusBox.style.color =
            "#dc2626";

    }

    else {

        statusBox.style.background =
            "#eff6ff";

        statusBox.style.color =
            "#1d4ed8";

    }

}

</script>

</body>
</html>
