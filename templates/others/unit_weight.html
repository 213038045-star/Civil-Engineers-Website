<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unit Weight Converter</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f5f7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 32px;
    width: 100%;
    max-width: 460px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    color: #1f2430;
    text-align: center;
  }
  .sub {
    text-align: center;
    font-size: 13px;
    color: #8a8fa3;
    margin-bottom: 20px;
  }
  .row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  input, select {
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #d7d9e0;
    border-radius: 8px;
    outline: none;
    background: #fafbfc;
  }
  input {
    flex: 1;
    min-width: 0;
  }
  select {
    flex: 1;
  }
  input:focus, select:focus {
    border-color: #6366f1;
  }
  .swap-btn {
    display: block;
    margin: 0 auto 16px;
    background: #6366f1;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .swap-btn:hover { background: #4f46e5; }
  .result {
    background: #f0f1ff;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    font-size: 17px;
    color: #1f2430;
    word-break: break-word;
    margin-bottom: 14px;
  }
  .result strong {
    color: #4338ca;
  }
  .table-wrap {
    border-top: 1px solid #eceef2;
    padding-top: 14px;
  }
  .table-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #8a8fa3;
    margin-bottom: 8px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  td {
    padding: 4px 0;
    color: #333;
  }
  td:last-child {
    text-align: right;
    font-weight: 600;
    color: #4338ca;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Unit Weight Converter</h1>
  <div class="sub">includes kip/ft³ ⇄ kN/m³ and common geotechnical/structural units</div>

  <div class="row">
    <input type="number" id="inputValue" value="1" step="any">
    <select id="fromUnit"></select>
  </div>

  <button class="swap-btn" onclick="swapUnits()">⇅ Swap</button>

  <div class="row">
    <select id="toUnit" style="flex: 1 1 100%;"></select>
  </div>

  <div class="result" id="result">—</div>

  <div class="table-wrap">
    <div class="table-title">All conversions (from your input)</div>
    <table id="allTable"></table>
  </div>
</div>

<script>
  // base unit: N/m³
  const units = {
    "kip/ft³ (kcf)": 157087.46,
    "kN/m³": 1000,
    "lb/ft³ (pcf)": 157.0875,
    "kgf/m³": 9.80665,
    "tonf/m³ (metric)": 9806.65,
    "MN/m³": 1000000,
    "N/m³": 1,
    "lb/in³ (pci)": 271447.16
  };

  // "more important" = the units most commonly needed alongside kip/ft³ <-> kN/m³
  const highlightUnits = ["kip/ft³ (kcf)", "kN/m³", "lb/ft³ (pcf)", "kgf/m³"];

  const fromSel = document.getElementById('fromUnit');
  const toSel = document.getElementById('toUnit');
  const input = document.getElementById('inputValue');
  const result = document.getElementById('result');
  const allTable = document.getElementById('allTable');

  for (const name in units) {
    fromSel.add(new Option(name, name));
    toSel.add(new Option(name, name));
  }
  fromSel.value = "kip/ft³ (kcf)";
  toSel.value = "kN/m³";

  function convert() {
    const val = parseFloat(input.value);
    if (isNaN(val)) {
      result.innerHTML = "Enter a valid number";
      allTable.innerHTML = "";
      return;
    }
    const base = val * units[fromSel.value];
    const converted = base / units[toSel.value];
    result.innerHTML = `${val} ${fromSel.value} = <strong>${formatNum(converted)} ${toSel.value}</strong>`;

    // build full comparison table, most important units first
    const ordered = Object.keys(units).sort((a, b) => {
      const ai = highlightUnits.indexOf(a), bi = highlightUnits.indexOf(b);
      if (ai !== -1 && bi !== -1) return ai - bi;
      if (ai !== -1) return -1;
      if (bi !== -1) return 1;
      return 0;
    });

    allTable.innerHTML = ordered.map(name => {
      const value = base / units[name];
      return `<tr><td>${name}</td><td>${formatNum(value)}</td></tr>`;
    }).join('');
  }

  function formatNum(n) {
    if (Math.abs(n) >= 1e6 || (Math.abs(n) < 1e-4 && n !== 0)) {
      return n.toExponential(4);
    }
    return parseFloat(n.toFixed(5)).toString();
  }

  function swapUnits() {
    const f = fromSel.value;
    fromSel.value = toSel.value;
    toSel.value = f;
    convert();
  }

  [input, fromSel, toSel].forEach(el => el.addEventListener('input', convert));
  convert();
</script>

</body>
</html>
