<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:#000;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hidden{display:none!important}
.top{display:flex;align-items:center;gap:4px;padding:8px 10px}
.top button{background:none;border:0;color:#fff;font-size:24px;padding:6px 10px;border-radius:8px}
.top button.on{color:#1fd1b9}
#bHD{font-size:13px;font-weight:800;border:2px solid currentColor;padding:2px 6px;border-radius:5px;margin:0 6px}
.sp{flex:1}
.chips{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto}
.chips button{flex:1;min-width:84px;background:none;border:0;color:#bbb;border-radius:8px;padding:8px 4px;font-size:18px;line-height:1.2}
.chips small{display:block;font-size:11px}
.chips button.on{background:#333;color:#1fd1b9}
#vf{position:relative;flex:1;min-height:0;background:#111;border-top:2px solid #1fd1b9;border-bottom:2px solid #1fd1b9}
#v{width:100%;height:100%;object-fit:contain;display:block}
.frame{position:absolute;inset:6%;border:2px dashed #ffffff66;border-radius:6px;pointer-events:none}
#info{position:absolute;top:6px;left:8px;font-size:12px;color:#fffb}
#hint{position:absolute;top:30px;left:0;right:0;text-align:center;padding:0 16px;font-size:15px;text-shadow:0 1px 3px #000}
.seg{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;background:#2a2a2a;border-radius:20px;padding:3px}
.seg button{border:0;background:none;color:#fff;padding:8px 20px;border-radius:18px;font-size:16px}
.seg button.on{background:#777}
#fx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.modes{display:flex;overflow-x:auto;gap:24px;padding:12px 16px;justify-content:center}
.modes button{background:none;border:0;color:#ddd;font-size:17px;padding:4px 0;white-space:nowrap;border-bottom:3px solid transparent}
.modes button.on{color:#1fd1b9;border-color:#1fd1b9}
.bottom{display:flex;align-items:center;justify-content:space-around;padding:8px 4px 16px}
.icon{position:relative;background:none;border:0;color:#fff;font-size:26px;display:flex;flex-direction:column;align-items:center;width:78px;cursor:pointer}
.icon small{font-size:13px;text-align:center;margin-top:4px}
.icon input{display:none}
#shutter{width:84px;height:84px;border-radius:50%;border:6px solid #1fd1b9;background:#fff;box-shadow:inset 0 0 0 4px #000}
#shutter:active{background:#ccc}
#badge{position:absolute;top:-4px;right:12px;background:#1fd1b9;color:#000;border-radius:10px;font-size:12px;padding:1px 6px;font-style:normal;font-weight:700}
#badge:empty{display:none}
.menu{position:absolute;top:56px;right:10px;background:#2a2a2a;border-radius:10px;z-index:5;display:flex;flex-direction:column;box-shadow:0 4px 14px #000a}
.menu button{background:none;border:0;color:#fff;padding:14px 18px;font-size:16px;text-align:left}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:99;max-width:90%;text-align:center}
/* busy overlay */
#busy{position:fixed;inset:0;background:#000a;z-index:100;display:flex;align-items:center;justify-content:center;font-size:17px}
/* preview */
#preview{background:#000;color:#fff;z-index:20}
#preview .top{background:#000;border-bottom:1px solid #333}
#previewArea{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#111;touch-action:none}
#previewImg{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform-origin:center center;user-select:none;-webkit-user-drag:none;transition:transform .15s ease}
.previewInfo{position:absolute;top:10px;left:10px;background:#000b;border-radius:14px;padding:6px 10px;font-size:13px;z-index:2}
.previewTools{display:flex;gap:8px;overflow-x:auto;padding:9px 10px;background:#181818;border-top:1px solid #333;border-bottom:1px solid #333;scrollbar-width:none}
.previewTools::-webkit-scrollbar{display:none}
.previewTools button{flex:0 0 auto;border:1px solid #444;background:#292929;color:#fff;border-radius:9px;padding:8px 11px;font-size:13px}
.previewTools button.sel{background:#1d4ed8;border-color:#1d4ed8;font-weight:700}
.previewBottom{display:flex;align-items:center;gap:8px;padding:10px;background:#000}
.previewBottom button{border:0;border-radius:9px;background:#292929;color:#fff;padding:11px 14px;font-size:15px}
.previewBottom .spacer{flex:1}
.previewBottom .done{background:#16a34a}
.previewZoom{display:flex;align-items:center;gap:6px;position:absolute;right:10px;bottom:10px;background:#000b;border-radius:12px;padding:5px;z-index:3}
.previewZoom button{border:0;background:#292929;color:#fff;width:38px;height:38px;border-radius:8px;font-size:20px}
/* review screen */
#rev{background:#f3f4f6;color:#111}
#rev .top{background:#1d4ed8;color:#fff}
#rev select{border:0;border-radius:8px;padding:8px;font-size:15px}
#list{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px;align-content:start}
.card{background:#fff;border-radius:10px;padding:8px;box-shadow:0 1px 3px #0003}
.card img{width:100%;height:190px;object-fit:contain;background:#e5e7eb;border-radius:6px}
.card .row{display:flex;gap:4px;margin-top:6px}
.card .row button{flex:1;padding:8px 0;border:0;border-radius:6px;background:#f3f4f6;font-size:14px}
.empty{grid-column:1/-1;text-align:center;color:#6b7280;padding:50px 0}
#msg{padding:4px 12px;font-size:14px;color:#374151;min-height:22px}
.bar2{display:flex;gap:8px;padding:10px;background:#fff;box-shadow:0 -1px 4px #0003}
.bar2 button{flex:1;padding:13px 4px;border:0;border-radius:10px;font-size:16px;background:#e5e7eb;color:#111}
.bar2 .green{background:#16a34a;color:#fff}
#cwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#cc{touch-action:none;user-select:none;-webkit-user-select:none}
#crop .bar2 button{font-size:14px;padding:13px 2px}#crop .bar2 button.act{background:#f59e0b;color:#000}
#cchint{color:#cbd5e1;font-size:13px;text-align:center;padding:2px 10px 6px}
#crop .bar2{background:#111}#crop .bar2 button{background:#333;color:#fff}#crop .bar2 .green{background:#16a34a}
.filterStrip{display:flex;gap:5px;overflow-x:auto;margin:7px 0 2px;padding:2px 0;scrollbar-width:none}
.filterStrip::-webkit-scrollbar{display:none}
.filterStrip button{flex:0 0 auto;border:1px solid #d1d5db;background:#f3f4f6;color:#374151;border-radius:8px;padding:7px 9px;font-size:12px;white-space:nowrap}
.filterStrip button.sel{background:#1d4ed8;color:#fff;border-color:#1d4ed8;font-weight:700}
.enhanceBox{display:none;background:#fff;color:#111;border-radius:14px;margin:6px 0 4px;padding:10px;box-shadow:0 2px 8px #0003}
.enhanceBox.on{display:block}
.enhanceTitle{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:8px}
.enhanceGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.enhanceGrid label{font-size:12px;color:#555}
.enhanceGrid input[type=range]{width:100%;accent-color:#1d4ed8}
.resetBtn{border:0;border-radius:8px;padding:8px 10px;background:#e5e7eb;color:#111}
.card .enh{display:flex;gap:5px;margin-top:6px}
.card .enh button{flex:1;padding:7px;border:0;border-radius:6px;background:#e5e7eb}
</style>
</head>
<body>

<!-- ============ CAMERA SCREEN ============ -->
<div id="cam" class="screen">
  <div class="top">
    <button onclick="closeCam()">✕</button><button onclick="refreshApp()" title="Refresh page">↻</button><span class="sp"></span>
    <button id="bFlash" onclick="flash()">⚡</button>
    <button id="bHD" class="on" onclick="toggleHD()">HD</button>
    <button onclick="$('menu').classList.toggle('hidden')">⋮</button>
  </div>
  <div id="menu" class="menu hidden">
    <button onclick="switchCam()">🔄 Switch camera</button>
    <button onclick="clearAll()">🗑 Clear all pages</button>
    <button id="bAC" onclick="toggleAC()">🧹 Auto clean: ON</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="vf">
    <video id="v" playsinline autoplay muted></video>
    <div class="frame"></div>
    <div id="info"></div><div id="hint"></div><div id="fx"></div>
    <div class="seg"><button id="sSingle" onclick="setBatch(false)">Single</button><button id="sBatch" class="on" onclick="setBatch(true)">Batch</button></div>
  </div>
  <div class="modes" id="modes"></div>
  <div class="bottom">
    <button class="icon" onclick="showRev()">▦<small>Pages</small><i id="badge"></i></button>
    <button id="shutter" onclick="shoot()" aria-label="Capture"></button>
    <label class="icon">🖼<small>Import Images</small><input type="file" id="impI" accept="image/*" multiple></label>
    <label class="icon">📁<small>Import Files</small><input type="file" id="impF" accept="image/*,.heic,.webp" multiple></label>
  </div>
  <input type="file" id="fallback" accept="image/*" capture="environment" class="hidden">
</div>

<!-- ============ REVIEW / EXPORT SCREEN ============ -->
<div id="rev" class="screen hidden">
  <div class="top">
    <button onclick="showCam()">‹</button><b id="title">Pages</b><button onclick="refreshApp()" title="Refresh page">↻</button><span class="sp"></span>
    <select id="ocrLang" title="Text language for Word (OCR)"><option value="eng">English</option><option value="ben+eng">Bangla + English</option><option value="hin+eng">Hindi + English</option></select>
  </div>
  <div id="list"></div>
  <div id="msg"></div>
  <div class="bar2">
    <button onclick="showCam()">＋ Add</button>
    <button id="bPDF" class="green" onclick="exportPDF()">⬇ PDF</button>
    <button id="bWord" onclick="exportWord()">⬇ Word</button>
    <button onclick="exportWordImg()">⬇ Img Word</button>
  </div>
</div>

<!-- ============ FULL PICTURE PREVIEW ============ -->
<div id="preview" class="screen hidden">
  <div class="top">
    <button onclick="closePreview()">✕</button>
    <b id="previewTitle">Preview</b>
    <span class="sp"></span>
    <button onclick="previewRotate()">⟳</button>
  </div>
  <div id="previewArea">
    <div id="previewInfo" class="previewInfo">Page 1</div>
    <img id="previewImg" alt="Picture preview">
    <div class="previewZoom">
      <button onclick="previewZoom(-.2)">−</button>
      <button onclick="previewReset()">1:1</button>
      <button onclick="previewZoom(.2)">＋</button>
    </div>
  </div>
  <div id="previewFilters" class="previewTools"></div>
  <div class="previewBottom">
    <button onclick="previewPrev()">◀</button>
    <button onclick="previewNext()">▶</button>
    <button onclick="openPreviewCrop()">✂ Crop</button>
    <button onclick="startRetake(previewI)" title="Retake picture">📷</button>
    <span class="spacer"></span>
    <button class="done" onclick="closePreview()">✓ Done</button>
  </div>
</div>

<div id="crop" class="screen hidden">
  <div class="top"><button onclick="showRev()">✕</button><b>Adjust edges</b><span class="sp"></span><button class="on" onclick="cropApply()">✓</button></div>
  <div id="cchint">Drag the corners or the edge dots to fit the page</div>
  <div id="cwrap"><canvas id="cc"></canvas></div>
  <div class="bar2"><button onclick="cropAuto()">✨ Auto</button><button onclick="cropFull()">⛶ All</button><button id="bendBtn" onclick="cropBend()">〰 Bend</button><button onclick="cropReset()">↺</button><button class="green" onclick="cropApply()">Done ✓</button></div>
</div>
<div id="toast" class="hidden"></div>
<div id="busy" class="hidden">Processing…</div>

<script>
const $ = id => document.getElementById(id);
const pages = [];
let stream=null, track=null, hd=true, batch=true, mode='scan', facing='environment',
    torch=false, camOK=false, resIdx=2, idShots=[], ic=null, photoCaps=null;
// label, width, height (requested photo size; the phone gives the closest it supports)
const RES = [['8K',7680,4320],['5K',5120,2880],['4K',3840,2160],['13M',4160,3120],['8M',3264,2448]];
const MODES = [['scan','Scan'],['word','To Word'],['id','ID Cards'],['photo','Photo']];

/* ---------- filters (CamScanner-style set) ---------- */
const FILTERS=[
  ['original','Original'],['auto','Auto'],['magic','Magic Color'],['light','Lighten'],
  ['noshadow','No Shadow'],['gray','Gray'],['bw','B&W'],['text','Black Text']
];
const FNAME=Object.fromEntries(FILTERS);
const PRESETS={
  original:{brightness:0,contrast:0,saturation:0,sharpness:0,shadow:0,whiten:0,clarity:0,bwLevel:50},
  auto:    {brightness:0,contrast:12,saturation:4,sharpness:45,shadow:90,whiten:75,clarity:25,bwLevel:50},
  magic:   {brightness:2,contrast:28,saturation:42,sharpness:60,shadow:95,whiten:90,clarity:40,bwLevel:50},
  light:   {brightness:18,contrast:-2,saturation:-8,sharpness:25,shadow:75,whiten:100,clarity:0,bwLevel:50},
  noshadow:{brightness:0,contrast:0,saturation:0,sharpness:20,shadow:100,whiten:35,clarity:0,bwLevel:50},
  gray:    {brightness:0,contrast:18,saturation:0,sharpness:50,shadow:90,whiten:85,clarity:35,bwLevel:50},
  bw:      {brightness:0,contrast:0,saturation:0,sharpness:55,shadow:95,whiten:90,clarity:30,bwLevel:50},
  text:    {brightness:0,contrast:10,saturation:0,sharpness:50,shadow:95,whiten:90,clarity:60,bwLevel:50}
};
function applyPreset(p,f){ Object.assign(p,PRESETS[f]||PRESETS.original); }
const SLIDERS=[['brightness','Brightness',-40,40],['contrast','Contrast',-30,50],['saturation','Saturation',-50,50],
  ['sharpness','Sharpness',0,100],['shadow','Shadow removal',0,100],['whiten','Paper whitening',0,100],
  ['clarity','Text darkness',0,100],['bwLevel','B&W level',0,100]];

/* ---------- UI builders ---------- */
function buildBars(){
  $('chips').innerHTML = RES.map((r,i)=>`<button class="${i==resIdx?'on':''}" onclick="setRes(${i})">${r[0]}<small>(${r[1]}x${r[2]})</small></button>`).join('');
  $('modes').innerHTML = MODES.map(m=>`<button class="${m[0]==mode?'on':''}" onclick="setMode('${m[0]}')">${m[1]}</button>`).join('');
}
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.remove('hidden'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.add('hidden'),2500); }
function setRes(i){ resIdx=i; buildBars(); startCam(); }
function setMode(m){ mode=m; idShots=[]; buildBars(); idHint(); if(m==='id') setBatch(true); $('hint').textContent = m==='scan' ? 'Auto crop + document enhancement' : (m==='word' ? 'Clean document scan for Word' : ''); }
function setBatch(b){ batch=b; $('sSingle').classList.toggle('on',!b); $('sBatch').classList.toggle('on',b); }
function toggleHD(){ hd=!hd; $('bHD').classList.toggle('on',hd); toast(hd?'HD on – best quality':'HD off – smaller files'); }
function idHint(){ const rid=typeof retakeIdx!=='undefined'&&retakeIdx>=0&&pages[retakeIdx]&&pages[retakeIdx].id; $('hint').textContent = (mode==='id'||rid) ? (idShots.length? 'Now capture the BACK of the card':'Capture the FRONT of the card') : ''; }
function updBadge(){ $('badge').textContent = pages.length||''; }
const busy=on=>$('busy').classList.toggle('hidden',!on);
const tick=()=>new Promise(r=>setTimeout(r,20));

/* ---------- camera ---------- */
function stopCam(){ if(stream) stream.getTracks().forEach(t=>t.stop()); stream=track=null; ic=null; photoCaps=null; torch=false; $('bFlash').classList.remove('on'); }
async function startCam(){
  stopCam();
  const [,W,H] = RES[resIdx], portrait = innerHeight > innerWidth;
  const w = portrait?Math.min(W,H):Math.max(W,H), h = portrait?Math.max(W,H):Math.min(W,H);
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:false,
      video:{facingMode:{ideal:facing}, width:{ideal:w}, height:{ideal:h}}});
    track = stream.getVideoTracks()[0];
    try{ await track.applyConstraints({advanced:[{focusMode:'continuous',exposureMode:'continuous',whiteBalanceMode:'continuous'}]}); }catch(e){ try{await track.applyConstraints({advanced:[{focusMode:'continuous'}]});}catch(_){} }
    $('v').srcObject = stream; camOK = true;
    ic=null; photoCaps=null;
    if('ImageCapture' in window){
      try{ ic=new ImageCapture(track); photoCaps=await ic.getPhotoCapabilities(); }catch(e){}
    }
    const s = track.getSettings();
    const mx = photoCaps&&photoCaps.imageWidth ? ' | max photo '+photoCaps.imageWidth.max+'×'+photoCaps.imageHeight.max : '';
    $('info').textContent = s.width+' × '+s.height+mx;
    idHint();
  }catch(e){
    camOK = false; $('info').textContent='';
    $('hint').textContent = 'Live camera not available here. The shutter will open your phone camera app instead.';
  }
}
function switchCam(){ $('menu').classList.add('hidden'); facing = facing==='environment'?'user':'environment'; startCam(); }
async function flash(){
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};
  if(!caps.torch) return toast('Flash is not supported by this browser/phone');
  torch=!torch;
  try{ await track.applyConstraints({advanced:[{torch}]}); $('bFlash').classList.toggle('on',torch); }
  catch(e){ torch=!torch; toast('Could not switch flash'); }
}
function fx(){ const f=$('fx'); f.style.opacity=.85; setTimeout(()=>f.style.opacity=0,120); if(navigator.vibrate) navigator.vibrate(30); }

async function shoot(){
  if(!camOK) return $('fallback').click();
  fx(); let blob=null;
  if(hd && ic){
    try{
      const [,W,H]=RES[resIdx], s={};
      if(photoCaps&&photoCaps.imageWidth){
        const pw=photoCaps.imageWidth, ph=photoCaps.imageHeight;
        s.imageWidth  = Math.max(pw.min||0, Math.min(pw.max, Math.max(W,H)));
        s.imageHeight = Math.max(ph.min||0, Math.min(ph.max, Math.min(W,H)));
      }
      blob = await ic.takePhoto(s);
    }catch(e){ try{ blob=await ic.takePhoto(); }catch(_){} }
  }
  if(!blob){
    const v=$('v'), c=document.createElement('canvas');
    c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0);
    blob = await new Promise(r=>c.toBlob(r,'image/jpeg',.95));
  }
  gotImage(blob);
}
$('fallback').onchange = e => { [...e.target.files].forEach(gotImage); e.target.value=''; };
$('impI').onchange = e => importFiles(e.target);
$('impF').onchange = e => importFiles(e.target);
async function importFiles(inp){
  if(retakeIdx>=0){ const fl=[...inp.files]; inp.value=''; for(const f of fl){ if(retakeIdx<0)break; try{ await doRetake(await loadImg(f)); }catch(e){ toast('Could not open image'); } } return; }
  if(mode==='id'){ const fl=[...inp.files]; inp.value=''; for(const f of fl){ try{ await gotImage(f); }catch(e){ toast('Could not open '+f.name); } } return; }
  busy(true); await tick();
  for(const f of [...inp.files]){ try{ addPage(await loadImg(f)); }catch(e){ toast('Could not open '+f.name); } }
  busy(false); inp.value=''; if(pages.length) showRev();
}

function loadImg(blob){ return new Promise((ok,no)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=URL.createObjectURL(blob); }); }
async function gotImage(blob){
  const img = await loadImg(blob);
  if(retakeIdx>=0) return doRetake(img);
  if(mode==='id'){
    idShots.push(img);
    if(idShots.length<2){ idHint(); return; }
    return composeId();
  }
  busy(true); await tick();
  addPage(img);
  busy(false);
  if(!batch&&mode!=='photo') openCrop(pages.length-1); else if(!batch) showRev(); else toast('Page '+pages.length+' added • '+img.naturalWidth+'×'+img.naturalHeight);
}
// ID card mode: front + back on one A4 page
function makeIdPage(a,b){
  const p={img:a,rot:0,quad:null,filter:'original',id:[{img:a,quad:cardQuad(a)},{img:b,quad:cardQuad(b)}]};
  applyPreset(p,'original');
  return p;
}
async function composeId(){
  const [a,b]=idShots; idShots=[];
  busy(true); await tick();
  try{
    const p=makeIdPage(a,b);
    p.thumb=draw(p,500).toDataURL('image/jpeg',.7);
    pages.push(p); updBadge();
    toast('ID added – tap ✂ Crop Front / ✂ Crop Back');
  }catch(e){ toast('Could not process the ID photos – please retake'); }
  busy(false); idHint(); showRev();
}
/* draws front (top) + back (bottom) on one white A4 page, each cut from its own original photo */
function composeIdCanvas(p,M){
  // NO fixed paper size: the page is exactly as big as the two cards (front on top, back below)
  // plus a thin white edge, so the card fills the page instead of floating in a big white sheet.
  const lim=Math.max(900,Math.min(3200,Math.round(M*1.1))),cw=Math.max(300,Math.min(3000,Math.round(M*.8)));
  const cards=p.id.map(s=>{
    let src=s.img;
    if(Math.max(src.naturalWidth,src.naturalHeight)>lim){          // cached smaller copy keeps previews fast
      if(!s._c||s._c.key!==lim){const t=smallCanvas(s.img,lim);t.naturalWidth=t.width;t.naturalHeight=t.height;s._c={key:lim,c:t};}
      src=s._c.c;
    }
    return warp(src,s.quad||fullQ(),cw);
  });
  const TW=Math.max(...cards.map(c=>c.width)),m=Math.round(TW*.035),gap=Math.round(TW*.035);
  const hs=cards.map(c=>Math.round(TW*c.height/c.width));
  const W=TW+2*m,H=hs[0]+hs[1]+gap+2*m,c=cv(W,H),x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);

/* =====================================================================
   DOCUMENT ENHANCEMENT ENGINE (CamScanner-style)
   1. Background estimation (dilate + blur, per channel) -> divide it out.
      This removes shadows, uneven light and colour cast, so the paper
      becomes flat white while ink stays dark.
   2. Auto-levels from the histogram (black point / white point).
   3. Tone curve: brightness, contrast, text-darkening gamma.
   4. Saturation (colour filters).

  else if(cSide>=0){cQ=cardQuad(p.img);cB=cZ();}
  else{const d=detectPage(p.img);cQ=d.q;cB=d.bend?cCopy(d.bend):cZ();}
  cQ0=cCopy(cQ);cB0=cCopy(cB);cBend=false;$('bendBtn').classList.remove('act');

  $('cchint').textContent=cSide>=0?(cSide===0?'FRONT card – drag the corners to fit the card':'BACK card – drag the corners to fit the card'):'Drag the corners or the edge dots to fit the page';
  cD=-1;cDrag=null;stopCam();

// Pinch / wheel zoom for the large preview.
(function(){
  let startDist=0,startScale=1;
  document.addEventListener('wheel',e=>{
    if($('preview').classList.contains('hidden')) return;
    if(!e.ctrlKey && e.deltaY===0) return;
    e.preventDefault(); previewZoom(e.deltaY<0?.1:-.1);
  },{passive:false});
  document.addEventListener('touchstart',e=>{
    if($('preview').classList.contains('hidden') || e.touches.length!==2) return;
    const a=e.touches[0],b=e.touches[1];
    startDist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); startScale=previewScale;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if($('preview').classList.contains('hidden') || e.touches.length!==2 || !startDist) return;
    const a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    previewScale=Math.max(.5,Math.min(4,startScale*(d/startDist)));

    e.preventDefault();
  },{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)startDist=0;},{passive:true});
})();

/* ---------- export ---------- */
const SIZES={a3:[297,420],a4:[210,297],a5:[148,210],letter:[215.9,279.4],legal:[215.9,355.6]};
function dims(p){
  const k='fit'; // no paper size: page = scanned image
  if(k==='fit'){ const r=297/Math.max(p.w,p.h); return {w:p.w*r,h:p.h*r,m:0}; }
  const [a,b]=SIZES[k]; return p.w>p.h ? {w:b,h:a,m:8} : {w:a,h:b,m:8};
}
async function bake(){
  $('msg').textContent='Preparing pages…';
  // Render each page ONCE through the exact same pipeline used by the preview.
  // This keeps crop/warp, bend correction, clean operations, rotation and
  // enhancement together instead of reconstructing a different crop in PDF.
  const MAX = hd ? Math.min(8000, Math.max(RES[resIdx][1],RES[resIdx][2])) : 1800;
  const q = hd ? .94 : .82, out=[];
  for(const [n,p] of pages.entries()){
    $('msg').textContent='Preparing page '+(n+1)+'/'+pages.length+'…';
    await new Promise(r=>setTimeout(r,30));

    const c=draw(p,MAX);
    // Make a detached final canvas so the exported bitmap cannot be affected
    // by any later crop-editor state.
    const finalC=cv(c.width,c.height);
    finalC.getContext('2d').drawImage(c,0,0);
    out.push({
      id:!!p.id,
      url:finalC.toDataURL('image/jpeg',q),
      w:finalC.width,
      h:finalC.height
    });
    await new Promise(r=>setTimeout(r,0));
  }
  return out;
}
function download(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
const stamp=()=>'scan_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');

async function exportPDF(){
  if(!pages.length) return toast('Add at least one page');

  const out=await bake(), {jsPDF}=window.jspdf;
  let pdf=null;
  // NO fixed paper size. Every page has the SAME width; its height simply follows the
  // shape of that scan (so large / tall / wide papers are never cut or squeezed into A4).
  // Pure white background with an even white margin around the scan.
  const PW=210, M=14;   // PW = common page width (mm, only a unit - any size scan fits), M = white margin

  out.forEach((p,i)=>{
    const mg=p.id?0:M;                       // ID pages already have their own thin white edge
    const iw=PW-2*mg, ih=iw*p.h/p.w;         // scan keeps its exact aspect ratio
    const pageW=PW, pageH=ih+2*mg, orient=pageH>pageW?'p':'l';

    if(i===0){
      pdf=new jsPDF({orientation:orient,unit:'mm',format:[pageW,pageH],compress:true});
    }else{
      pdf.addPage([pageW,pageH],orient);
    }
    pdf.setFillColor(255,255,255);
    pdf.rect(0,0,pageW,pageH,'F');
    pdf.addImage(p.url,'JPEG',mg,mg,iw,ih,undefined,'FAST');
  });

  pdf.save(stamp()+'.pdf');
  $('msg').textContent='PDF saved ✔ — same width, size follows your scan, white background';
}
async function exportWord(){
  if(!pages.length) return toast('Add at least one page');
  if(!window.Tesseract){ toast('OCR could not load (internet needed). Saving page images instead.'); return exportWordImg(); }
  const lang=$('ocrLang').value,{Document,Packer,Paragraph,TextRun}=window.docx,sections=[]; let worker;
  try{
    $('msg').textContent='Loading OCR ('+lang+')… first time it downloads language data';
    worker=await Tesseract.createWorker(lang,1,{logger:m=>{ if(m.status==='recognizing text') $('msg').textContent='Reading text… '+Math.round(m.progress*100)+'%'; }});
    for(const [n,p] of pages.entries()){
      $('msg').textContent='Reading page '+(n+1)+'/'+pages.length+'…'; await tick();
      const {data}=await worker.recognize(draw(p,hd?3000:2000));
      const kids=data.text.split('\n').map(t=>new Paragraph({children:[new TextRun({text:t.trim(),size:24})]}));
      sections.push({children:kids.length?kids:[new Paragraph('')]});
    }
    await worker.terminate();
    download(await Packer.toBlob(new Document({sections})), stamp()+'.docx');
    $('msg').textContent='Word file saved ✔ (editable text)';
  }catch(e){ try{ if(worker) await worker.terminate(); }catch(_){} $('msg').textContent=''; toast('OCR failed – saving page images instead'); exportWordImg(); }
}
async function exportWordImg(){
  if(!pages.length) return toast('Add at least one page');
  const out=await bake();
  const {Document,Packer,Paragraph,ImageRun,AlignmentType,PageOrientation}=window.docx;
  const tw=mm=>Math.round(mm/25.4*1440), px=mm=>mm/25.4*96, sections=[];
  for(const p of out){
    const d=dims(p), land=d.w>d.h, buf=await (await fetch(p.url)).arrayBuffer();
    const r=Math.min(px(d.w-2*d.m)/p.w, px(d.h-2*d.m)/p.h)*0.96;
    sections.push({
      properties:{page:{
        size:{width:tw(Math.min(d.w,d.h)),height:tw(Math.max(d.w,d.h)),orientation:land?PageOrientation.LANDSCAPE:PageOrientation.PORTRAIT},
        margin:{top:tw(d.m),bottom:tw(d.m),left:tw(d.m),right:tw(d.m)}}},
      children:[new Paragraph({alignment:AlignmentType.CENTER,children:[
        new ImageRun({data:buf,type:'jpg',transformation:{width:Math.round(p.w*r),height:Math.round(p.h*r)}})]})]
    });
  }
  download(await Packer.toBlob(new Document({sections})), stamp()+'.docx');
  $('msg').textContent='Word file saved ✔';
}

/* ---------- colour tools ---------- */
const CN={red:0,lal:0,orange:28,yellow:55,peela:55,green:120,hara:120,cyan:180,blue:225,nila:225,neela:225,purple:280,violet:280,magenta:310,pink:330};
function hsv(r,g,b){r/=255;g/=255;b/=255;const m=Math.max(r,g,b),d=m-Math.min(r,g,b);let h=0;
  if(d){h=m===r?((g-b)/d)%6:m===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360;}return[h,m?d/m:0,m];}
function matcher(s,ref){const t=s.tol;
  if(s.k==='sat')return(r,g,b)=>{const q=hsv(r,g,b);return q[1]>.3&&q[2]>.3;};
  if(s.k==='rel'){const th=(.299*ref[0]+.587*ref[1]+.114*ref[2])*s.f;return(r,g,b)=>.299*r+.587*g+.114*b<th;}
  if(s.k==='off'){const th=26-t*.2;return(r,g,b)=>Math.hypot(r-ref[0],g-ref[1],b-ref[2])/1.73>th;}
  if(s.k==='dark'){const th=50+t*1.2;return(r,g,b)=>.299*r+.587*g+.114*b<th;}
  if(s.k==='rgb'){const th=40+t*2;return(r,g,b)=>Math.hypot(r-s.r,g-s.g,b-s.b)<th;}
  const sm=Math.max(.12,.4-t*.004);
  if(s.k==='any')return(r,g,b)=>{const q=hsv(r,g,b);return q[1]>sm&&q[2]>.18;};
  const ht=18+t*.5;
  return(r,g,b)=>{const q=hsv(r,g,b);if(q[1]<sm||q[2]<.18)return false;const d=Math.abs(q[0]-s.h);return Math.min(d,360-d)<=ht;};}
function dilate(m,w,h,r){const t=new Uint8Array(m.length);
  for(let y=0;y<h;y++){const o=y*w;let c=0;for(let i=0;i<Math.min(r,w);i++)c+=m[o+i];
    for(let x=0;x<w;x++){if(x+r<w)c+=m[o+x+r];if(x-r-1>=0)c-=m[o+x-r-1];t[o+x]=c>0?1:0;}}
  for(let x=0;x<w;x++){let c=0;for(let i=0;i<Math.min(r,h);i++)c+=t[i*w+x];
    for(let y=0;y<h;y++){if(y+r<h)c+=t[(y+r)*w+x];if(y-r-1>=0)c-=t[(y-r-1)*w+x];m[y*w+x]=c>0?1:0;}}}

/* ops: {t:'color'|'border'|'rect'|'trim', s:spec, f:'white'|'page'}; applied to the flattened page BEFORE rotation/filters */
function pageCol(a,m,n){
  const s=Math.max(1,n/2e5|0),hist=new Uint32Array(256),L=i=>.299*a[i*4]+.587*a[i*4+1]+.114*a[i*4+2];let cnt=0;
  for(let i=0;i<n;i+=s)if(!m||!m[i]){hist[L(i)|0]++;cnt++;}
  if(!cnt)return[255,255,255];
  let acc=0,th=255;for(let v=0;v<256;v++){acc+=hist[v];if(acc>=cnt*.6){th=v;break;}}
  let r=0,g=0,b=0,k=0;for(let i=0;i<n;i+=s)if((!m||!m[i])&&L(i)>=th){r+=a[i*4];g+=a[i*4+1];b+=a[i*4+2];k++;}
  return k?[r/k,g/k,b/k]:[255,255,255];
}
/* fill masked pixels with the LOCAL paper colour (follows shadows/gradients), not one flat colour */
function localFill(a,m,w,h){
  const n=w*h,S=Math.max(w,h)/160,sw=Math.max(2,Math.round(w/S)),sh=Math.max(2,Math.round(h/S)),N=sw*sh,
    R=new Float32Array(N),G=new Float32Array(N),B=new Float32Array(N),W=new Float32Array(N),st=Math.max(1,Math.round(Math.max(w,h)/1500));
  for(let y=0;y<h;y+=st){const cy=Math.min(sh-1,(y/h*sh)|0);
    for(let x=0;x<w;x+=st){const i=y*w+x;if(m[i])continue;const k=cy*sw+Math.min(sw-1,(x/w*sw)|0),j=i*4;R[k]+=a[j];G[k]+=a[j+1];B[k]+=a[j+2];W[k]++;}}
  let wm=0,cc=0;for(let k=0;k<N;k++)if(W[k]>0){wm+=W[k];cc++;}
  const th=cc?.04*wm/cc:1,gc=pageCol(a,m,n),
    L=[2,6,16,48].map(r=>[R,G,B,W].map(A=>{const t=A.slice();boxBlur(t,sw,sh,r);return t;})),
    F=[new Float32Array(N),new Float32Array(N),new Float32Array(N)];
  for(let k=0;k<N;k++){let ok=false;
    for(const q of L)if(q[3][k]>th){F[0][k]=q[0][k]/q[3][k];F[1][k]=q[1][k]/q[3][k];F[2][k]=q[2][k]/q[3][k];ok=true;break;}
    if(!ok){F[0][k]=gc[0];F[1][k]=gc[1];F[2][k]=gc[2];}}
  for(let y=0;y<h;y++){
    const v=Math.min(sh-1.001,Math.max(0,(y+.5)/h*sh-.5)),y0=v|0,fy=v-y0;

  ['preview','crop','clean','rev'].forEach(id=>{const e=$(id); if(e)e.classList.add('hidden');});
  showCam();
  toast(pages[i].id?(retakeSide>=0?'Retaking the '+(retakeSide?'BACK':'FRONT')+' of the card':'Retaking ID card – capture the FRONT first'):'Retaking page '+(i+1)+' – take the new picture');
}
async function doRetake(img){
  const i=retakeIdx;
  if(i<0||i>=pages.length){ retakeIdx=-1; return; }
  const old=pages[i];
  if(old.id&&retakeSide>=0){                     // ID card: replace only ONE side
    const sd=retakeSide; retakeIdx=-1; retakeSide=-1;
    busy(true); await tick();
    try{ old.id[sd]={img,quad:cardQuad(img)}; old.thumb=draw(old,500).toDataURL('image/jpeg',.7); }
    catch(e){ toast('Could not process the picture'); }
    busy(false); showRev(); return toast((sd?'Back':'Front')+' replaced ✔ – tap ✂ Crop '+(sd?'Back':'Front')+' to adjust');
  }
  if(old.id){                                    // ID card: needs a new front AND back
    idShots.push(img);
    if(idShots.length<2){ idHint(); return toast('Now capture the BACK of the card'); }
    const [a,b]=idShots; idShots=[]; retakeIdx=-1;
    busy(true); await tick();
    const np=makeIdPage(a,b); np.filter=old.filter; SLIDERS.forEach(([k])=>{ if(old[k]!=null) np[k]=old[k]; });
    np.thumb=draw(np,500).toDataURL('image/jpeg',.7);
    pages[i]=np; openEnh.clear(); updBadge(); busy(false); showRev(); return toast('ID card replaced ✔');
  }
  retakeIdx=-1;
  busy(true); await tick();
  addPage(img, old.filter, !old.quad);          // new picture, same filter
  const np=pages.pop();
  SLIDERS.forEach(([k])=>{ if(old[k]!=null) np[k]=old[k]; });   // keep the page's enhancement settings
  pages[i]=np; openEnh.clear(); updBadge();
  np.thumb=draw(np,500).toDataURL('image/jpeg',.7);
  busy(false); showRev(); toast('Page '+(i+1)+' replaced ✔');
}
function refreshApp(){
  if(pages.length && !confirm('Refresh the page? Pages that are not exported yet will be lost.')) return;
  location.reload();
}

/* ---------- start ---------- */
buildBars(); startCam(); idHint();
</script>
