<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>T-Beam Analysis — Moment &amp; Load Capacity</title>
<style>
  :root{
    --paper:#0a0e17; --rule:#232c3d; --ink:#e9edf5; --blue:#8b96ab; --blue-deep:#e9edf5;
    --accent:#e8562f; --ok:#3ecf8e; --warn:#e8562f; --teal:#3ecf8e;
    --panel:#141b28; --panel-nested:#0e141f;
    --mono:"IBM Plex Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:
      radial-gradient(circle at 10% -10%, rgba(232,86,47,.06) 0%, transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(62,207,142,.05) 0%, transparent 40%),
      var(--paper);
    color:var(--ink);font-family:var(--mono);padding:28px 16px 60px;}
  .sheet{max-width:1040px;margin:0 auto;background:var(--panel);border:1px solid var(--rule);box-shadow:5px 5px 0 rgba(232,86,47,0.10);}
  .title{border-bottom:2px solid var(--blue-deep);padding:20px 28px;}
  .title h1{margin:0 0 4px;font-size:22px;color:var(--blue-deep);}
  .title .sub{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);}
  .grid{display:grid;grid-template-columns:320px 1fr;gap:0;}
  @media (max-width:820px){.grid{grid-template-columns:1fr;}}
  .inputs{border-right:2px solid var(--rule);padding:20px 22px;}
  @media (max-width:820px){.inputs{border-right:none;border-bottom:2px solid var(--rule);}}
  fieldset{border:none;padding:0;margin:0 0 16px;}
  legend{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);font-weight:600;margin-bottom:8px;}
  label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:8px;}
  input,select{width:110px;font-family:var(--mono);font-size:12.5px;padding:4px 6px;border:1px solid var(--blue);background:var(--panel-nested);color:var(--ink);}
  button#calc{width:100%;padding:11px;margin-top:6px;background:var(--accent);color:#0a0e17;border:none;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;cursor:pointer;}
  button#calc:hover{background:var(--teal);}
  .output{padding:20px 26px;font-size:12.5px;line-height:1.6;}
  .step{margin-bottom:14px;padding-left:12px;border-left:2px solid var(--rule);}
  .step.hl{border-left-color:var(--blue);}
  .step b{color:var(--blue-deep);}
  .verdict{font-weight:700;} .verdict.pass{color:var(--ok);} .verdict.fail{color:var(--warn);}
  .final{margin-top:16px;border:2px solid var(--blue-deep);padding:14px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;background:rgba(232,86,47,.06);}
  .final .label{font-size:10px;text-transform:uppercase;color:var(--blue);}
  .final .big{font-size:22px;font-weight:700;color:var(--blue-deep);}
  .diagram-svg{width:100%;height:auto;aspect-ratio:300/160;display:block;margin-top:14px;}
  .placeholder{color:var(--blue);opacity:.6;font-style:italic;}
</style>
</head>
<body>
<div class="sheet">
  <div class="title">
    <h1>T-Beam Analysis — Moment &amp; Load Capacity</h1>
    <div class="sub">Given section &amp; steel &rarr; find &phi;Mn and max allowable load — ACI 318 Whitney stress block</div>
  </div>
  <div class="grid">
    <div class="inputs">
      <fieldset>
        <legend>Geometry (in)</legend>
        <label><span>Web width, bw</span><input type="number" id="bw" value="10" step="1"></label>
        <label><span>Flange thickness, hf</span><input type="number" id="hf" value="6" step="0.5"></label>
        <label><span>Beam depth, h</span><input type="number" id="h" value="28" step="1"></label>
        <label><span>Effective depth, d</span><input type="number" id="d" value="26" step="0.5"></label>
      </fieldset>
      <fieldset>
        <legend>Effective flange width</legend>
        <label><span>Beam type</span>
          <select id="beamType">
            <option value="interior">Interior (slab both sides)</option>
            <option value="isolated">Isolated T-beam</option>
          </select>
        </label>
        <label><span>Span, L (ft)</span><input type="number" id="span" value="20" step="1"></label>
        <label id="spacingRow"><span>Avg clear spacing (ft)</span><input type="number" id="spacing" value="8" step="1"></label>
      </fieldset>
      <fieldset>
        <legend>Materials</legend>
        <label><span>f'c (ksi)</span><input type="number" id="fc" value="3" step="0.5"></label>
        <label><span>fy (ksi)</span><input type="number" id="fy" value="60" step="5"></label>
      </fieldset>
      <fieldset>
        <legend>Reinforcement</legend>
        <label><span>Bar size</span>
          <select id="barsize">
            <option value="3">#3</option><option value="4">#4</option><option value="5">#5</option>
            <option value="6">#6</option><option value="7">#7</option><option value="8">#8</option>
            <option value="9">#9</option><option value="10" selected>#10</option><option value="11">#11</option>
          </select>
        </label>
        <label><span># of bars</span><input type="number" id="nbars" value="6" step="1" min="2"></label>
      </fieldset>
      <fieldset>
        <legend>Load capacity (uses span above)</legend>
        <label><span>Support condition</span>
          <select id="coeff">
            <option value="8">Simply supported (/8)</option>
            <option value="10">One end continuous (/10)</option>
            <option value="11">Both ends continuous (/11)</option>
            <option value="14">ACI approx, end span (/14)</option>
            <option value="16">ACI approx, interior span (/16)</option>
            <option value="2">Cantilever (/2)</option>
          </select>
        </label>
      </fieldset>
      <button id="calc">Analyze section</button>
    </div>
    <div class="output" id="output">
      <p class="placeholder">Enter section properties and click "Analyze section".</p>
    </div>
  </div>
</div>

<script>
const barArea = {3:0.11,4:0.20,5:0.31,6:0.44,7:0.60,8:0.79,9:1.00,10:1.27,11:1.56};
const barDia  = {3:0.375,4:0.5,5:0.625,6:0.75,7:0.875,8:1.0,9:1.128,10:1.27,11:1.41};
const fmt=(x,d=2)=>(Math.abs(x)<1e-9?0:x).toFixed(d);

const beamType=document.getElementById('beamType');
const spacingRow=document.getElementById('spacingRow');
beamType.addEventListener('change',()=>{ spacingRow.style.display = beamType.value==='isolated'?'none':'flex'; });

function effectiveFlangeWidth(bw,hf,spanIn,spacingIn,isolated){
  if(isolated) return Math.min(4*bw, bw+2*(spanIn/8));
  return Math.min(spanIn/4, bw+16*hf, bw+spacingIn);
}

function beta1(fc){ if(fc<=4)return 0.85; if(fc>=8)return 0.65; return 0.85-0.05*(fc-4); }

function analyze(){
  const bw=+document.getElementById('bw').value;
  const hf=+document.getElementById('hf').value, h=+document.getElementById('h').value, d=+document.getElementById('d').value;
  const fc=+document.getElementById('fc').value, fy=+document.getElementById('fy').value;
  const barsize=+document.getElementById('barsize').value, nbars=+document.getElementById('nbars').value;
  const span=+document.getElementById('span').value, coeff=+document.getElementById('coeff').value;
  const spacing=+document.getElementById('spacing').value;
  const isolated = beamType.value==='isolated';

  const out=document.getElementById('output');
  if([bw,hf,h,d,fc,fy,nbars,span,coeff].some(v=>isNaN(v)||v<=0) || (!isolated && (isNaN(spacing)||spacing<=0))){
    out.innerHTML='<p class="verdict fail">Check inputs — all values must be positive numbers.</p>';
    return;
  }

  const spanIn = span*12, spacingIn = spacing*12;
  const b = effectiveFlangeWidth(bw,hf,spanIn,spacingIn,isolated);

  const As = nbars*barArea[barsize];
  let html='';
  html+=`<div class="step hl"><b>0a. Steel provided</b><div>${nbars}-#${barsize} &rarr; As = ${fmt(As)} in&sup2;</div></div>`;
  html+=`<div class="step hl"><b>0b. Effective flange width</b><div>bf = ${isolated?'min(4bw, bw+2(L/8))':'min(L/4, bw+16hf, bw+spacing)'} = <b>${fmt(b,2)} in</b></div></div>`;

  const a_rect = As*fy/(0.85*fc*b);
  html+=`<div class="step"><b>1. Check rectangular behavior (b=${fmt(b,1)} in)</b><div>a = As&middot;fy/(0.85&middot;f'c&middot;b) = ${fmt(a_rect)} in (hf=${fmt(hf,1)} in)</div></div>`;

  let Mn, a_final, mode;
  if(a_rect<=hf){
    Mn = As*fy*(d-a_rect/2);
    a_final = a_rect;
    mode='Rectangular';
    html+=`<div class="step"><span class="verdict pass">a &le; hf &rarr; rectangular section.</span><div>Mn = As&middot;fy&middot;(d&minus;a/2) = ${fmt(Mn)} k-in</div></div>`;
  } else {
    mode='T-beam';
    html+=`<div class="step"><span class="verdict fail">a &gt; hf &rarr; true T-beam. Splitting flange + web.</span></div>`;
    const Asf = 0.85*fc*(b-bw)*hf/fy;
    const Mn1 = Asf*fy*(d-hf/2);
    html+=`<div class="step hl"><b>2a. Flange</b><div>Asf = 0.85&middot;f'c&middot;(b&minus;bw)&middot;hf/fy = ${fmt(Asf)} in&sup2;</div><div>Mn1 = Asf&middot;fy&middot;(d&minus;hf/2) = ${fmt(Mn1)} k-in</div></div>`;
    const a_web = (As-Asf)*fy/(0.85*fc*bw);
    const Mn2 = (As-Asf)*fy*(d-a_web/2);
    html+=`<div class="step hl"><b>2b. Web</b><div>a = (As&minus;Asf)&middot;fy/(0.85&middot;f'c&middot;bw) = ${fmt(a_web)} in</div><div>Mn2 = (As&minus;Asf)&middot;fy&middot;(d&minus;a/2) = ${fmt(Mn2)} k-in</div></div>`;
    Mn = Mn1+Mn2;
    a_final = a_web;
    html+=`<div class="step"><b>3. Combine</b><div>Mn = Mn1 + Mn2 = ${fmt(Mn)} k-in</div></div>`;
  }

  const b1 = beta1(fc);
  const c = a_final/b1;
  const et = 0.003*(d-c)/c;
  let phi, cls;
  if(et>=0.005){phi=0.9; cls='Tension-controlled';}
  else if(et>=0.002){phi=0.65+(et-0.002)*(250/3); cls='Transition zone';}
  else {phi=0.65; cls='Compression-controlled — not permitted';}
  const clsOk = et>=0.005 ? 'pass':'fail';
  phi = Math.min(phi,0.9);
  const phiMn = phi*Mn;

  // load capacity: Mu(k-ft) = coeff-inverse -> wu = coeff*Mu/(L^2)
  const phiMn_kft = phiMn/12;
  const wu_max = coeff*phiMn_kft/(span*span);
  const coeffLabel = document.getElementById('coeff').selectedOptions[0].text;
  html+=`<div class="step hl" style="margin-top:4px;"><b>5. Maximum allowable factored load</b><div>${coeffLabel}, span L=${fmt(span,1)} ft &nbsp; (Mu = wu&middot;L&sup2;/n &le; &phi;Mn &rarr; wu,max = n&middot;&phi;Mn/L&sup2;)</div></div>`;

  html+=`<div class="final">
    <div><div class="label">Behavior</div><div>${mode}</div></div>
    <div><div class="label">&phi;Mn — design moment capacity</div><div class="big">${fmt(phiMn)} k-in <span style="font-size:13px;">(${fmt(phiMn_kft,2)} k-ft)</span></div></div>
    <div><div class="label">wu,max — allowable factored load</div><div class="big">${fmt(wu_max,3)} kip/ft</div></div>
  </div>`;

  out.innerHTML=html;
  drawSection({b,bw,hf,h,d,a:a_final,mode,nbars,barsize});
}

function drawSection(R){
  const old=document.getElementById('sectionSvg');
  if(old) old.remove();
  const scale=Math.min(240/Math.max(R.b,R.bw*3), 130/R.h);
  const flangeW=R.b*scale, webW=R.bw*scale, hfH=R.hf*scale, hH=R.h*scale;
  const cx=150, topY=15;
  const flangeX=cx-flangeW/2, webX=cx-webW/2;
  const isRect = R.mode==='Rectangular';
  const aH=Math.min(R.a,R.h)*scale;
  const fillC = isRect?'rgba(31,110,122,0.35)':'rgba(232,86,47,0.30)';
  const strokeC = isRect?'#3ecf8e':'#e8562f';
  let stress='';
  if(isRect || R.a<=R.hf){
    stress=`<rect x="${flangeX}" y="${topY}" width="${flangeW}" height="${aH}" fill="${fillC}" stroke="${strokeC}"/>`;
  } else {
    const webPortion=Math.max(R.a-R.hf,0)*scale;
    stress=`<rect x="${flangeX}" y="${topY}" width="${flangeW}" height="${hfH}" fill="${fillC}" stroke="${strokeC}"/>
    <rect x="${webX}" y="${topY+hfH}" width="${webW}" height="${webPortion}" fill="${fillC}" stroke="${strokeC}"/>`;
  }
  const dY=R.d*scale;

  // Real bar diameter (in), real 1.5 in clear cover to bar centerline region,
  // shrunk to fit — and wrapped into two rows if a single row would overlap.
  const dbIn = barDia[R.barsize];
  const coverPx = 1.5*scale;
  const availPx = Math.max(webW - 2*coverPx, 10);
  const idealR = Math.max(3, (dbIn/2)*scale*1.3);

  function rowLayout(n, radius){
    if(n<=1) return {xs:[webX+webW/2], r:radius};
    const spacing = availPx/(n-1);
    const r = Math.min(radius, spacing/2 - 1);
    const xs=[]; for(let i=0;i<n;i++) xs.push(webX+coverPx+spacing*i);
    return {xs, r: Math.max(r,2.5), spacing};
  }

  let layout = rowLayout(R.nbars, idealR);
  let rows = [{xs:layout.xs, r:layout.r, y:topY+dY}];

  // if bars would overlap even after shrinking below a legible size, split into two rows
  const minLegibleR = 3;
  if(layout.r < minLegibleR && R.nbars>2){
    const n1 = Math.ceil(R.nbars/2), n2 = R.nbars-n1;
    const l1 = rowLayout(n1, idealR), l2 = rowLayout(n2, idealR);
    const r = Math.max(Math.min(l1.r,l2.r), minLegibleR-0.5);
    const rowGap = r*2+4;
    rows = [
      {xs:l1.xs, r, y:topY+dY-rowGap/2},
      {xs:l2.xs, r, y:topY+dY+rowGap/2}
    ];
  }

  let bars='';
  rows.forEach(row=>{
    row.xs.forEach(bx=>{
      bars+=`<circle cx="${bx}" cy="${row.y}" r="${row.r}" fill="#e8562f" stroke="#0a0e17" stroke-width="0.7"/>`;
    });
  });

  const container=document.createElement('div');
  container.id='sectionSvg';
  container.innerHTML=`<svg class="diagram-svg" viewBox="0 0 300 160">
    <rect x="${flangeX}" y="${topY}" width="${flangeW}" height="${hfH}" fill="none" stroke="#8b96ab" stroke-width="1.2"/>
    <rect x="${webX}" y="${topY+hfH}" width="${webW}" height="${hH-hfH}" fill="none" stroke="#8b96ab" stroke-width="1.2"/>
    ${stress}
    ${bars}
    <text x="150" y="${topY-6}" font-size="8" fill="#e9edf5" text-anchor="middle" font-family="monospace">bf=${fmt(R.b,1)}"</text>
    <text x="150" y="${topY+hH+12}" font-size="8" fill="#e9edf5" text-anchor="middle" font-family="monospace">bw=${fmt(R.bw,1)}"</text>
  </svg>`;
  document.getElementById('output').appendChild(container);
}

document.getElementById('calc').addEventListener('click', analyze);
</script>
</body>
</html>
